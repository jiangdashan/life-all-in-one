<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<!-- 修改桌面图标名称：把下面的「日常集」三处一起改成你想要的，然后重新发布即可 -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>日常集</title>
<meta name="application-name" content="日常集">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="日常集">
<meta name="theme-color" content="#33506b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="apple-touch-icon" href="icon-512.png">
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; width: 100%;
    background: #f7f8f9; color: #252a31;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
    overflow: hidden; overscroll-behavior: none;
    -webkit-tap-highlight-color: transparent;
  }
  #frame {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    border: 0; background: #f7f8f9;
  }
  #overlay {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 16px; background: #f7f8f9;
    z-index: 10;
    padding-bottom: env(safe-area-inset-bottom);
  }
  .spinner {
    width: 34px; height: 34px;
    border: 3px solid #e4e8ec;
    border-top-color: #33506b;
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .tip { font-size: 14px; color: #6b7683; }
  #fallback {
    display: none; flex-direction: column; gap: 12px;
    align-items: center; max-width: 82%; text-align: center;
  }
  #fallback a {
    color: #33506b; text-decoration: none;
    border: 1px solid #e4e8ec; border-radius: 10px;
    padding: 10px 16px; font-size: 14px; background: #fff;
  }
</style>
</head>
<body>
  <iframe id="frame" src="https://richangji-28051.app.workbuddy.host/"
          title="日常集" referrerpolicy="no-referrer-when-downgrade"
          allow="clipboard-read; clipboard-write"></iframe>

  <div id="overlay">
    <div class="spinner"></div>
    <div class="tip">正在加载工作台…</div>
    <div id="fallback">
      <div class="tip">加载较慢或被拦截，可点击下方按钮直接在浏览器打开：</div>
      <a id="openLink" href="https://richangji-28051.app.workbuddy.host/" target="_blank" rel="noopener">打开工作台</a>
    </div>
  </div>

  <script>
    (function () {
      var APP_NAME = '日常集'; // 与上方 meta 保持一致
      var frame = document.getElementById('frame');
      var overlay = document.getElementById('overlay');
      var fallback = document.getElementById('fallback');
      var loaded = false;
      function hide() { if (loaded) return; loaded = true; overlay.style.display = 'none'; }
      frame.addEventListener('load', function () { setTimeout(hide, 400); });
      // 超时兜底：12s 未触发 load 则展示直接打开按钮（保留 iframe 不移除）
      setTimeout(function () { if (!loaded) { fallback.style.display = 'flex'; } }, 12000);
      // 来自工作台的名称同步（best-effort，需工作台主动 postMessage）
      window.addEventListener('message', function (e) {
        try {
          var d = e.data;
          if (d && d.type === 'APP_BRAND' && d.name) {
            document.title = d.name;
            var m = document.querySelector('meta[name="apple-mobile-web-app-title"]');
            if (m) m.setAttribute('content', d.name);
          }
        } catch (err) {}
      });
    })();
  </script>
</body>
</html>
